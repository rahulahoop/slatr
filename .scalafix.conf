rules = [
  RemoveUnused
  DisableSyntax
]

# Keep the domain typed: ban bare `Any` (XmlElement and friends replace it).
# `\bAny\b` does not match AnyRef/AnyVal/AnyFlatSpec, so Java-boundary code and
# scalatest base classes are unaffected.
DisableSyntax.regex = [
  {
    id = noAny
    pattern = "\\bAny\\b"
    message = "Use a precise type (e.g. XmlElement) instead of Any."
  }
]
